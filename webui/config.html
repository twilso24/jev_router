<html>
<head><title>Jev Router · Routing</title></head>
<body>
<div x-data>
  <template x-if="config">
    <div>
      <div class="section-title">Jev Router</div>
      <div class="section-description">Per-call model routing judged by Jev. Configure your TypeSafe access and routing behavior below.</div>

      <div class="field">
        <div class="field-label">
          <label class="field-title">Routing enabled</label>
          <div class="field-description">Master switch for per-call routing. The plugin toggle in the plugin list also disables everything.</div>
        </div>
        <div class="field-control"><input type="checkbox" x-model="config.enabled" /></div>
      </div>

      <div class="field">
        <div class="field-label">
          <label class="field-title" for="jev-api-key">TypeSafe API key</label>
          <div class="field-description">Leave blank to use TYPESAFE_API_KEY from Agent Zero's secrets or environment.</div>
        </div>
        <div class="field-control" x-data="{ showKey: false }" style="display:flex;gap:0.5rem;align-items:center;">
          <input id="jev-api-key" :type="showKey ? 'text' : 'password'" x-model="config.jev_api_key" autocomplete="off" spellcheck="false" placeholder="Enter key" style="min-width:0;flex:1;" />
          <button type="button" @click="showKey = !showKey" :aria-label="showKey ? 'Hide API key' : 'Show API key'" :aria-pressed="showKey"><x-icon :name="showKey ? 'visibility_off' : 'visibility'"></x-icon></button>
          <a href="https://console.typesafe.ai/" target="_blank" rel="noopener noreferrer" style="white-space:nowrap;">Get API key</a>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-model">Jev model</label><div class="field-description">Use jev-latest, or pin a Jev version available to your account.</div></div>
        <div class="field-control"><input id="jev-model" type="text" x-model="config.jev_model" placeholder="jev-latest" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-timeout">HTTP timeout (seconds)</label><div class="field-description">Per TypeSafe HTTP attempt. 1–300.</div></div>
        <div class="field-control"><input id="jev-timeout" type="number" min="1" max="300" x-model.number="config.jev_timeout" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-budget">Judgment budget (seconds)</label><div class="field-description">Max time routing may spend judging one message before falling back to the active preset.</div></div>
        <div class="field-control"><input id="jev-budget" type="number" min="0.5" max="30" step="0.5" x-model.number="config.jev_timeout_s" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-deleg-threshold">Delegation threshold</label><div class="field-description">Delegate-worthy score at or above this recommends a subordinate profile. 0–1.</div></div>
        <div class="field-control"><input id="jev-deleg-threshold" type="number" min="0" max="1" step="0.05" x-model.number="config.delegation_threshold" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-deleg-mode">Delegation mode</label><div class="field-description">advise: inject a recommendation into the loop. auto: also pre-select the profile for new chats.</div></div>
        <div class="field-control">
          <select id="jev-deleg-mode" x-model="config.delegation_mode">
            <option value="advise">advise</option>
            <option value="auto">auto</option>
          </select>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-preselect">New-chat profile pre-selection</label><div class="field-description">Let Jev suggest the agent profile when a new chat starts.</div></div>
        <div class="field-control"><input id="jev-preselect" type="checkbox" x-model="config.chat_preselect" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-dyn-switch">Dynamic profile switching</label><div class="field-description">Let Jev switch the agent profile mid-chat as the task changes (every user message, from message 2). Requires delegation mode auto and new-chat pre-selection.</div></div>
        <div class="field-control"><input id="jev-dyn-switch" type="checkbox" x-model="config.dynamic_switch_enabled" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-dyn-threshold">Switch confidence threshold</label><div class="field-description">Minimum Jev confidence for a judgment to count toward a profile switch. 0–1.</div></div>
        <div class="field-control"><input id="jev-dyn-threshold" type="number" min="0" max="1" step="0.05" x-model.number="config.dynamic_switch_threshold" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-dyn-consecutive">Consecutive matching messages</label><div class="field-description">Same task class must be judged this many messages in a row before a switch happens. 1–10.</div></div>
        <div class="field-control"><input id="jev-dyn-consecutive" type="number" min="1" max="10" x-model.number="config.dynamic_switch_consecutive" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-dyn-cooldown">Switch cooldown (seconds)</label><div class="field-description">Minimum time between switches to the same profile. Prevents flip-flopping.</div></div>
        <div class="field-control"><input id="jev-dyn-cooldown" type="number" min="0" max="3600" step="5" x-model.number="config.dynamic_switch_cooldown_seconds" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-fit-enabled">Fit-aware model selection</label><div class="field-description">Let Jev pick the preset it judges the best functional match for the message (when confident), instead of always taking the band head.</div></div>
        <div class="field-control"><input id="jev-fit-enabled" type="checkbox" x-model="config.fit_enabled" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-fit-confidence">Fit confidence floor</label><div class="field-description">Minimum Jev confidence for a preset fit judgment to override the band order. 0–1.</div></div>
        <div class="field-control"><input id="jev-fit-confidence" type="number" min="0" max="1" step="0.05" x-model.number="config.fit_min_confidence" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-breaker-threshold">Circuit breaker threshold</label><div class="field-description">Consecutive provider failures before the breaker trips and excludes the provider.</div></div>
        <div class="field-control"><input id="jev-breaker-threshold" type="number" min="1" max="20" x-model.number="config.breaker_threshold" /></div>
      </div>

      <div class="field">
        <div class="field-label"><label class="field-title" for="jev-breaker-cooldown">Breaker cooldown (hours)</label><div class="field-description">How long a tripped provider stays excluded before retry.</div></div>
        <div class="field-control"><input id="jev-breaker-cooldown" type="number" min="0.1" max="24" step="0.1" x-model.number="config.breaker_cooldown_hours" /></div>
      </div>

      <div class="section-description">Advanced policy (provider include/exclude, schedules, band tuning) lives in the Jev Router panel and <code>routing-policy.yaml</code>.</div>
    </div>
  </template>
</div>
</body>
</html>
