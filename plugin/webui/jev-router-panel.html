<script type="module">
import { callJsonApi } from '/js/api.js';

const CHIPS_KEY = 'jev_panel_chips';
const AUTO_KEY = 'jev_panel_auto';

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function fmtTs(ts) {
  let d = null;
  if (typeof ts === 'number') d = new Date(ts > 1e12 ? ts : ts * 1000);
  else if (typeof ts === 'string' && ts) {
    const p = Date.parse(ts);
    if (!isNaN(p)) d = new Date(p);
  }
  if (!d || isNaN(d.getTime())) {
    const raw = String(ts || '');
    return raw ? raw.slice(-8) : '--:--:--';
  }
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function bandClass(band) {
  const b = String(band || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  return ['light', 'medium', 'heavy'].indexOf(b) >= 0 ? 'band-' + b : 'band-unknown';
}

function decisionRow(d) {
  const row = el('div', 'jev-decision');
  const top = el('div', 'jev-decision-top');
  const name = d.target || 'keep-model';
  const model = el('span', 'jev-model', name);
  model.title = name;
  top.appendChild(model);
  top.appendChild(el('span', 'jev-chip ' + bandClass(d.band), String(d.band || 'n/a')));
  if (d.rule) top.appendChild(el('span', 'jev-chip jev-rule-chip', String(d.rule)));
  top.appendChild(el('span', 'jev-ts', fmtTs(d.ts)));
  row.appendChild(top);
  const human = d.reason_human || d.reason;
  if (human) {
    const line = el('div', 'jev-decision-reason', human);
    if (d.reason && d.reason_human) line.title = d.reason;
    row.appendChild(line);
  }
  if (d.profile_match) top.appendChild(el('span', 'jev-chip', 'profile:' + d.profile_match));
  if (d.preset_fit) {
    if (d.rule) {
      if (!d.fit_used) top.appendChild(el('span', 'jev-chip jev-fit-skip', 'fit-skipped'));
    } else {
      top.appendChild(el('span', 'jev-chip' + (d.fit_used ? '' : ' jev-fit-skip'), d.fit_used ? 'fit' : 'fit-skipped'));
    }
  }
  if (d.delegation) top.appendChild(el('span', 'jev-chip jev-deleg-chip' + (d.delegation === 'directed' ? ' directed' : ''), String(d.delegation) + (d.auto_exec ? '·auto' : '')));
  return row;
}

function breakerRow(p, onReset) {
  const line = el('div', 'jev-breaker-row');
  const prov = el('span', 'jev-provider', p.provider);
  prov.title = p.provider;
  line.appendChild(prov);
  line.appendChild(el('span', 'jev-status-badge ' + (p.excluded ? 'badge-excluded' : 'badge-healthy'), p.excluded ? 'Excluded' : 'Healthy'));
  line.appendChild(el('span', 'jev-ts', 'fails:' + p.failures));
  if (p.excluded) {
    const btn = el('button', 'jev-btn btn-secondary jev-btn-sm', 'Reset');
    btn.type = 'button';
    btn.onclick = async () => { await onReset(p.provider); };
    line.appendChild(btn);
  }
  return line;
}

function initPanel(root) {
  if (root.__jevInit) return;
  const q = sel => root.querySelector(sel);

  let lastDecSig = '';
  let lastBrSig = '';

  const refresh = async () => {
    try {
      const s = await callJsonApi('plugins/jev_router/routing_stats', { limit: 20 });
      const dec = (s && s.ok && s.recent) ? s.recent : [];
      const dsig = JSON.stringify(dec);
      if (dsig !== lastDecSig) {
        lastDecSig = dsig;
        const box = q('.jev-recent');
        box.textContent = '';
        if (!s.ok) box.appendChild(el('div', 'jev-empty', 'stats error'));
        else if (!dec.length) box.appendChild(el('div', 'jev-empty', 'no decisions yet'));
        else dec.forEach(d => box.appendChild(decisionRow(d)));
      }

      const br = await callJsonApi('plugins/jev_router/routing_breaker', {});
      const snap = (br && br.snapshot) ? br.snapshot : [];
      const bsig = JSON.stringify(snap);
      if (bsig !== lastBrSig) {
        lastBrSig = bsig;
        const bb = q('.jev-breaker');
        bb.textContent = '';
        if (!snap.length) bb.appendChild(el('div', 'jev-empty', 'all providers healthy'));
        else snap.forEach(p => bb.appendChild(breakerRow(p, async provider => {
          await callJsonApi('plugins/jev_router/routing_breaker', { action: 'reset', provider: provider });
          refresh();
        })));
      }
    } catch (e) {
      q('.jev-status').textContent = 'load error';
    }
  };

  const applyChips = () => {
    root.classList.toggle('no-chips', !q('.jev-chips-toggle').checked);
    try { localStorage.setItem(CHIPS_KEY, q('.jev-chips-toggle').checked ? '1' : '0'); } catch (e) {}
  };

  const stopAuto = () => {
    if (root.__jevTimer) { clearInterval(root.__jevTimer); root.__jevTimer = null; }
  };

  const applyAuto = () => {
    const on = q('.jev-auto-toggle').checked;
    stopAuto();
    if (on) {
      root.__jevTimer = setInterval(() => {
        if (!document.body.contains(root)) { stopAuto(); return; }
        refresh();
        loadTuning();
      }, 20000);
    }
    try { localStorage.setItem(AUTO_KEY, on ? '1' : '0'); } catch (e) {}
  };

  q('.jev-chips-toggle').onchange = applyChips;
  q('.jev-auto-toggle').onchange = applyAuto;
  try {
    if (localStorage.getItem(CHIPS_KEY) === '0') q('.jev-chips-toggle').checked = false;
    if (localStorage.getItem(AUTO_KEY) !== '0') q('.jev-auto-toggle').checked = true;
  } catch (e) {}
  applyChips();
  applyAuto();

  // --- Band Tuning ---
  let tuneOrders = null;
  let tuneStats = {};
  let provStates = [];
  let exclSet = new Set();
  let exclBusy = false;
  let autoTune = false;
  let pinnedSet = new Set();
  let lastTuneSig = '';
  const BANDS_KEY = 'jev_panel_bands';
  let bandOpen = { light: true, medium: false, heavy: false };
  try { Object.assign(bandOpen, JSON.parse(localStorage.getItem(BANDS_KEY) || '{}')); } catch (e) {}
  const saveBands = () => { try { localStorage.setItem(BANDS_KEY, JSON.stringify(bandOpen)); } catch (e) {} };

  const renderTuning = () => {
    const box = q('.jev-tuning');
    box.textContent = '';
    if (!tuneOrders) { box.appendChild(el('div', 'jev-empty', 'no data')); return; }
    for (const band of ['light', 'medium', 'heavy']) {
      const wrap = el('div', 'jev-band' + (bandOpen[band] ? ' open' : ''));
      const head = el('button', 'jev-band-head');
      head.type = 'button';
      head.setAttribute('aria-expanded', bandOpen[band] ? 'true' : 'false');
      head.appendChild(el('span', 'jev-band-chevron', '▶'));
      head.appendChild(el('span', 'jev-band-name', band));
      head.appendChild(el('span', 'jev-band-nums', String((tuneOrders[band] || []).length)));
      const isPinned = pinnedSet.has(band);
      const pinBtn = el('span', 'jev-band-nums jev-pin-btn' + (isPinned ? ' pinned' : ''), isPinned ? 'pinned' : 'pin');
      pinBtn.setAttribute('role', 'button');
      pinBtn.tabIndex = 0;
      pinBtn.title = isPinned ? 'Unpin: return ' + band + ' to auto-ranking' : 'Pin: freeze this band order (manual wins)';
      pinBtn.onclick = async (ev) => {
        ev.stopPropagation();
        try {
          const r = await callJsonApi('plugins/jev_router/routing_policy', { action: 'set_pin', band: band, pinned: !isPinned });
          if (r && r.ok) { lastTuneSig = ''; await loadTuning(); }
        } catch (e) {}
      };
      pinBtn.onkeydown = (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pinBtn.onclick(ev); }
      };
      head.appendChild(pinBtn);
      head.onclick = () => {
        bandOpen[band] = !bandOpen[band];
        saveBands();
        wrap.classList.toggle('open', bandOpen[band]);
        head.setAttribute('aria-expanded', bandOpen[band] ? 'true' : 'false');
      };
      wrap.appendChild(head);
      const bodyWrap = el('div', 'jev-band-body-wrap');
      const body = el('div', 'jev-band-body');
      const arr = tuneOrders[band] || [];
      arr.forEach((preset, i) => {
        const row = el('div', 'jev-band-row');
        const name = el('span', 'jev-band-preset', preset);
        name.title = preset;
        row.appendChild(name);
        const st = tuneStats[preset];
        if (st) row.appendChild(el('span', 'jev-band-nums', st.ok + 'ok ' + st.fail + 'fail'));
        if (pinnedSet.has(band)) {
          row.appendChild(el('span', 'jev-band-nums jev-frozen', 'frozen'));
        } else {
          const up = el('button', 'jev-btn btn-secondary jev-btn-sm', '▲');
          up.type = 'button';
          up.setAttribute('aria-label', 'move ' + preset + ' up in ' + band);
          up.onclick = () => moveTune(band, i, -1);
          const dn = el('button', 'jev-btn btn-secondary jev-btn-sm', '▼');
          dn.type = 'button';
          dn.setAttribute('aria-label', 'move ' + preset + ' down in ' + band);
          dn.onclick = () => moveTune(band, i, 1);
          row.appendChild(up);
          row.appendChild(dn);
        }
        body.appendChild(row);
      });
      bodyWrap.appendChild(body);
      wrap.appendChild(bodyWrap);
      box.appendChild(wrap);
    }
  };

  const moveTune = (band, i, dir) => {
    const arr = tuneOrders && tuneOrders[band];
    if (!arr) return;
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    renderTuning();
  };

  const renderExcludes = () => {
    const box = q('.jev-chips');
    box.textContent = '';
    if (!provStates.length) { box.appendChild(el('div', 'jev-empty', 'no providers in pool')); return; }
    provStates.forEach(ps => {
      const pr = ps.provider;
      let cls = 'jev-xchip';
      let label = pr;
      let title;
      if (ps.tripped) { cls += ' tripped'; label = String.fromCharCode(0x26D4) + ' ' + pr; title = 'breaker tripped - click to reset'; }
      else if (ps.excluded) { cls += ' excl'; title = 'excluded by policy - click to re-include'; }
      else if (ps.fail > 0) { cls += ' failing'; title = ps.fail + ' recent failures - click to exclude'; }
      else { title = 'healthy - click to exclude'; }
      const chip = el('button', cls, label);
      chip.type = 'button';
      chip.setAttribute('aria-pressed', ps.excluded ? 'true' : 'false');
      chip.title = title;
      chip.onclick = async () => {
        if (exclBusy) return;
        exclBusy = true;
        const st = q('.jev-status');
        try {
          if (ps.tripped) {
            await callJsonApi('plugins/jev_router/routing_breaker', { action: 'reset', provider: pr });
            st.textContent = 'breaker reset';
          } else {
            const nex = new Set(exclSet);
            if (ps.excluded) nex.delete(pr); else nex.add(pr);
            const r = await callJsonApi('plugins/jev_router/routing_policy', { action: 'write', exclude: [...nex] });
            if (!r.ok) { st.textContent = 'error: ' + (r.error || '?'); }
            else { exclSet = nex; st.textContent = 'saved'; setTimeout(() => { st.textContent = ''; }, 2000); }
          }
          lastTuneSig = '';
          await loadTuning();
        } catch (e2) { st.textContent = 'error'; }
        exclBusy = false;
        renderExcludes();
      };
      box.appendChild(chip);
    });
  };

  const renderWire = (wire, unwired) => {
    const box = q('.jev-wire');
    if (!box) return;
    const parts = [];
    if (wire && Array.isArray(wire.added))
      for (const n of wire.added) parts.push(['+ ' + n, 'add']);
    if (wire && Array.isArray(wire.pruned))
      for (const n of wire.pruned) parts.push(['− ' + n, 'prune']);
    if (Array.isArray(unwired) && unwired.length)
      parts.push(['unwired: ' + unwired.join(', '), 'warn']);
    box.textContent = '';
    if (!parts.length) { box.hidden = true; return; }
    box.hidden = false;
    for (const [label, cls] of parts) {
      const chip = el('span', 'jev-wire-chip ' + cls, label);
      chip.title = label;
      box.appendChild(chip);
    }
  };

  const renderAutoFeed = (cur, ranked) => {
    const feed = q('.jev-autofeed');
    if (!feed) return;
    feed.textContent = '';
    const lines = [];
    for (const band of ['light', 'medium', 'heavy']) {
      const c = cur[band] || [];
      const r = ranked[band] || [];
      if (c.join('|') === r.join('|')) continue;
      const promoted = r.find((n, idx) => c.indexOf(n) > idx);
      const st = promoted ? tuneStats[promoted] : null;
      const ev = st ? (' (' + st.ok + 'ok/' + st.fail + 'fail)') : '';
      lines.push(band + ': auto-ranked' + (promoted ? ' - ' + promoted + ' promoted' + ev : ''));
    }
    if (!lines.length) {
      feed.appendChild(el('div', 'jev-decision-reason', 'no auto-tune changes vs saved orders'));
      return;
    }
    lines.forEach((t2) => feed.appendChild(el('div', 'jev-decision-reason', t2)));
  };

  const loadTuning = async () => {
    const st = q('.jev-tune-status');
    try {
      const t = await callJsonApi('plugins/jev_router/routing_policy', { action: 'tuning' });
      if (!t.ok) { st.textContent = 'tuning error'; return; }
      autoTune = t.auto_tune === true;
      const atChip = q('.jev-autotune-chip');
      if (atChip) {
        atChip.textContent = autoTune ? 'auto-tune on' : 'auto-tune off';
        atChip.classList.toggle('pinned', autoTune);
      }
      pinnedSet = new Set(Object.entries(t.pinned_bands || {})
        .filter(([, v]) => v).map(([b]) => b));
      const orders = autoTune ? (t.suggested || t.current) : t.current;
      const sig = JSON.stringify([orders, t.stats || {}, t.provider_states || [], t.wire_state || null, t.unwired || [], t.pinned_bands || {}]);
      if (sig === lastTuneSig) return;
      lastTuneSig = sig;
      tuneOrders = JSON.parse(JSON.stringify(orders));
      tuneStats = t.stats || {};
      provStates = Array.isArray(t.provider_states) ? t.provider_states : [];
      exclSet = new Set(provStates.filter(ps => ps.excluded).map(ps => ps.provider));
      if (!exclBusy) renderExcludes();
      renderWire(t.wire_state, t.unwired);
      renderTuning();
      st.textContent = autoTune ? 'ranked from live telemetry' : 'auto-tune off';
      if (autoTune) setTimeout(() => { const s2 = q('.jev-tune-status'); if (s2) s2.textContent = ''; }, 3000);
      renderAutoFeed(t.current || {}, orders);
    } catch (e) { st.textContent = 'tuning load error'; }
  };  

  q('.jev-tune-apply').onclick = async () => {
    const st = q('.jev-tune-status');
    if (!tuneOrders) { st.textContent = 'nothing to apply'; return; }
    try {
      const r = await callJsonApi('plugins/jev_router/routing_policy', { action: 'write_band_orders', band_orders: tuneOrders });
      st.textContent = r.ok ? 'applied - pin a band to keep a manual order' : ('error: ' + (r.error || '?'));
      if (r.ok) setTimeout(() => { st.textContent = ''; }, 3000);
    } catch (e) { st.textContent = 'apply error'; }
  };

  const atChip = q('.jev-autotune-chip');
  if (atChip) {
    atChip.setAttribute('role', 'button');
    atChip.tabIndex = 0;
    atChip.title = 'Toggle auto-tune (live telemetry band ranking)';
    const toggleAuto = async () => {
      try {
        const r = await callJsonApi('plugins/jev_router/routing_policy', { action: 'set_auto_tune', enabled: !autoTune });
        if (r && r.ok) { lastTuneSig = ''; await loadTuning(); }
      } catch (e) {}
    };
    atChip.onclick = toggleAuto;
    atChip.onkeydown = (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggleAuto(); }
    };
  }
  loadTuning();

  root.__jevInit = { refresh };
  refresh();
}

function scan() {
  document.querySelectorAll('.jev-panel').forEach(initPanel);
}

const mo = new MutationObserver(scan);
mo.observe(document.body, { childList: true, subtree: true });
scan();
</script>
